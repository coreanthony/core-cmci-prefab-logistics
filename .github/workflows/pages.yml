name: Deploy logistics tracker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - site-data/**
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public site only
        run: |
          mkdir -p _site/site-data
          cp index.html styles.css app.js _site/
          cp site-data/tracker.json _site/site-data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
